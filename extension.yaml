manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.openai-tools
kind: tool_provider
version: 1.1.0
display_name: OpenAI Tools
description: Decisions, moderation, images, audio and embeddings using a project OpenAI connection.
vendor:
  name: Flow Steward
listing:
  category: ai
  tags:
  - openai
  - image
  - audio
  - moderation
  summary: Use OpenAI decisions, moderation, images, audio and embeddings in workflows.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_openai_tools
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each project chooses its own OpenAI connection.
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_seconds: 120
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
egress:
  hosts:
  - api.openai.com
runtime:
  compatibility:
    platform_min: 1.4.0
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
python_requirements: []
external_effects:
- operation_id: predicate
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: choice
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: score
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: moderate_text
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: moderate_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: generate_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: edit_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: transcribe
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: speech
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: embed
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress

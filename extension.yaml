  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: moderate_text
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: moderate_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: generate_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: edit_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: transcribe
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: speech
  effect_kind: paid_api_call

manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.openai-tools
kind: tool_provider
version: 1.1.4
display_name: OpenAI Tools
description: |-
  Build content-review, media-preparation and text-analysis workflows with OpenAI Tools. It provides focused actions across several OpenAI API families. Make a yes-or-no decision, choose from supplied options or score ordered levels using a prompt and evidence. Moderate text or an image and pass the flagged result and category information into review or routing steps.

  Media actions generate or edit an image artifact, transcribe an audio artifact to text, or turn text into a speech artifact. Text embedding actions return ordered vectors with model, dimension and usage information. These functions can support content preparation, transcription pipelines, moderation queues and small embedding batches. They are workflow tools; this extension does not add a conversational model to the agent model catalog.

  Each action uses a selected project OpenAI connection and returns its relevant result or output artifact plus a provider request ID. Image inputs accept PNG, JPEG and WebP up to 15 MB; audio inputs are limited to 24 MB. Embedding calls accept one to four texts and do not chunk them automatically. Inputs are sent to OpenAI, where model access, pricing and API availability apply. The speech model is scheduled to shut down on 6 January 2027.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-ai-openai-tools/issues
  website_url: https://github.com/Flow-Steward/ext-ai-openai-tools
listing:
  category: ai
  tags:
  - openai
  - image
  - audio
  - moderation
  summary: Add OpenAI decision, moderation, image, audio and embedding actions to workflows using a project API
    connection.
  setup_summary: Create an OpenAI project API key with access and billing for the required APIs, save it in a project-scoped
    OpenAI connection and select it in an Extension tools step.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_openai_tools
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each project chooses its own OpenAI connection.
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_seconds: 120
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
egress:
  hosts:
  - api.openai.com
runtime:
  compatibility:
    platform_min: 1.4.0
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
python_requirements: []
external_effects:
- operation_id: predicate
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: choice
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: score

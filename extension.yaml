manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.openai-tools
kind: tool_provider
version: 1.0.0
display_name: OpenAI Tools
description: Decisions, moderation, images and audio using a project OpenAI connection.
vendor:
  name: Flow Steward
listing:
  category: ai
  tags:
  - openai
  - image
  - audio
  - moderation
  summary: Use OpenAI decisions, moderation, images and audio in workflows.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_openai_tools
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each project chooses its own OpenAI connection.
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_seconds: 120
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
egress:
  hosts:
  - api.openai.com
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
python_requirements:
- name: flowsteward-extension-sdk
  version: 0.4.0
  hashes:
  - sha256:ffb5f3764d5a384b4441f6e3c0c4e66f5887d57c156fdc93abf70b5d0eeb22af
- name: cffi
  version: 2.1.0
  hashes:
  - sha256:1e9f50d192a3e525b15a75ab5114e442d83d657b7ec29182a991bc9a88fd3a66
  - sha256:b6422532152adf4e59b110cb2808cee7a033800952f5c036b4af047ee43199e7
- name: cryptography
  version: 49.0.0
  hashes:
  - sha256:0e959b578856a3924bc0cbb710fc12c387b9412a951389f3ca61704a9e25f325
  - sha256:36d1709f992593689b45bda411498d62c6e365f2ca00b84657d4dadd24de16db
- name: pycparser
  version: '3.0'
  hashes:
  - sha256:b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992
external_effects:
- operation_id: predicate
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: choice
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: score
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: moderate_text
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: moderate_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: generate_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: edit_image
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: transcribe
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress
- operation_id: speech
  effect_kind: paid_api_call
  channel: openai
  idempotency: required
  test_mode_behavior: suppress

schema_version: extension_descriptor_v1
extension_id: flowsteward.openai-tools
release_version: 1.0.3
extension_type: service_extension
identity:
  display_name: OpenAI Tools
  description: OpenAI decisions, moderation, images and audio.
  tags:
  - openai
  - ai
vendor:
  vendor_name: Flow Steward
listing:
  visibility: private_reference
  category: ai
distribution:
  channel: private_byo
  execution_modes:
  - local
  allows_self_hosted: true
  requires_connected_control_plane: false
  import_sources:
  - file
runtime:
  compatibility:
    platform_min: 1.4.0
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifacts:
  extensions:
  - extension_id: flowsteward.openai-tools
    ref: extension.yaml
    publish: true
  workflows:
  - workflow_id: demo_openai_moderation
    ref: artifacts/workflows/demo_openai_moderation.yaml
    publish: true
provenance:
  origin: user_generated
commerce:
  billing_mode: free

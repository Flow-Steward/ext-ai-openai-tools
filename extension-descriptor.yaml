schema_version: extension_descriptor_v1
extension_id: flowsteward.openai-tools
release_version: 1.1.4
extension_type: service_extension
identity:
  display_name: OpenAI Tools
  description: 'Build content-review, media-preparation and text-analysis workflows with OpenAI Tools. It provides
    focused actions across several OpenAI API families. Make a yes-or-no decision, choose from supplied options
    or score ordered levels using a prompt and evidence. Moderate text or an image and pass the flagged result and
    category information into review or routing steps.


    Media actions generate or edit an image artifact, transcribe an audio artifact to text, or turn text into a
    speech artifact. Text embedding actions return ordered vectors with model, dimension and usage information.
    These functions can support content preparation, transcription pipelines, moderation queues and small embedding
    batches. They are workflow tools; this extension does not add a conversational model to the agent model catalog.


    Each action uses a selected project OpenAI connection and returns its relevant result or output artifact plus
    a provider request ID. Image inputs accept PNG, JPEG and WebP up to 15 MB; audio inputs are limited to 24 MB.
    Embedding calls accept one to four texts and do not chunk them automatically. Inputs are sent to OpenAI, where
    model access, pricing and API availability apply. The speech model is scheduled to shut down on 6 January 2027.'
  tags:
  - openai
  - ai
vendor:
  vendor_name: Flow Steward
listing:
  visibility: private_reference
  category: ai
distribution:
  channel: private_byo
  execution_modes:
  - local
  allows_self_hosted: true
  requires_connected_control_plane: false
  import_sources:
  - file
runtime:
  compatibility:
    platform_min: 1.4.0
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifacts:
  extensions:
  - extension_id: flowsteward.openai-tools
    ref: extension.yaml
    publish: true
  workflows:
  - workflow_id: demo_openai_moderation
    ref: artifacts/workflows/demo_openai_moderation.yaml
    publish: true
provenance:
  origin: user_generated
commerce:
  billing_mode: free

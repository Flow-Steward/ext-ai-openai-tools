forms:
- operation_id: predicate
  title: Estimate a yes probability
  section: OpenAI Tools
  fields:
  - name: prompt
    widget_type: textarea
    label: Decision instructions
    required: true
    help_text: Explain the question to evaluate using Evidence. Maximum 16000 characters.
    placeholder: Does the customer request a refund?
  - name: evidence
    widget_type: textarea
    label: Evidence to evaluate
    required: true
    help_text: Text the decision should evaluate, such as a customer message. Maximum 16000 characters.
    placeholder: I would like to return my order and get a refund.
- operation_id: choice
  title: Choose an option from evidence
  section: OpenAI Tools
  fields:
  - name: prompt
    widget_type: textarea
    label: Decision instructions
    required: true
    help_text: Explain the question to evaluate using Evidence. Maximum 16000 characters.
    placeholder: Classify the customer request by topic.
  - name: evidence
    widget_type: textarea
    label: Evidence to evaluate
    required: true
    help_text: Text the decision should evaluate, such as a customer message. Maximum 16000 characters.
    placeholder: I would like to return my order and get a refund.
  - name: choices
    widget_type: json
    label: Allowed options (JSON array)
    required: true
    help_text: Supply 2–20 distinct nonempty strings, each at most 100 characters. The returned value is one of
      these exact strings.
    placeholder: '["billing","technical","general"]'
- operation_id: score
  title: Score evidence against ordered levels
  section: OpenAI Tools
  fields:
  - name: prompt
    widget_type: textarea
    label: Decision instructions
    required: true
    help_text: Explain the question to evaluate using Evidence. Maximum 16000 characters.
    placeholder: Rate how urgently this customer request needs attention.
  - name: evidence
    widget_type: textarea
    label: Evidence to evaluate
    required: true
    help_text: Text the decision should evaluate, such as a customer message. Maximum 16000 characters.
    placeholder: I would like to return my order and get a refund.
  - name: levels
    widget_type: json
    label: Levels from lowest to highest (JSON array)
    required: true
    help_text: Supply 2–20 distinct nonempty labels, each at most 100 characters, ordered from lowest to highest.
      A numeric score ranges from 0 through level count minus one.
    placeholder: '["routine","important","urgent"]'
- operation_id: moderate_text
  title: Check text for flagged content
  section: OpenAI Tools
  fields:
  - name: text
    widget_type: textarea
    label: Text to check
    required: true
    help_text: Text for content moderation, at most 16000 characters. Inspect flagged and categories in a later
      workflow step.
    placeholder: A customer message to review.
- operation_id: moderate_image
  title: Check an image for flagged content
  section: OpenAI Tools
  fields:
  - name: artifact_handle
    widget_type: artifact_picker
    label: Source image artifact
    required: true
    help_text: 'Map an image artifact from an earlier step: PNG, JPEG or WebP, up to 15000000 bytes.'
- operation_id: generate_image
  title: Generate an image from a prompt
  section: OpenAI Tools
  fields:
  - name: prompt
    widget_type: textarea
    label: Image description
    required: true
    help_text: Describe the image to generate, including subject, composition and appearance. Maximum 32000 characters.
    placeholder: A studio photograph of a blue ceramic cup on a white background.
- operation_id: edit_image
  title: Edit an image using instructions
  section: OpenAI Tools
  fields:
  - name: artifact_handle
    widget_type: artifact_picker
    label: Source image artifact
    required: true
    help_text: 'Map an image artifact from an earlier step: PNG, JPEG or WebP, up to 15000000 bytes.'
  - name: prompt
    widget_type: textarea
    label: Image editing instructions
    required: true
    help_text: Describe changes to the selected source image. Maximum 32000 characters.
    placeholder: Replace the background with a plain white studio background.
- operation_id: transcribe
  title: Transcribe an audio file to text
  section: OpenAI Tools
  fields:
  - name: artifact_handle
    widget_type: artifact_picker
    label: Audio artifact
    required: true
    help_text: Map an audio artifact from an earlier workflow step, up to 24 MB. Supply its actual filename below.
  - name: filename
    widget_type: text
    label: Original audio filename
    required: true
    help_text: 'Use the real audio extension: mp3, mp4, mpeg, mpga, m4a, wav or webm. The extension is required
      for the upload.'
    placeholder: meeting.wav
- operation_id: speech
  title: Generate speech from text
  section: OpenAI Tools
  fields:
  - name: text
    widget_type: textarea
    label: Text to speak
    required: true
    help_text: Text to synthesize, at most 4096 characters. Output is an audio artifact; inform listeners that the
      voice is AI-generated.
    placeholder: Your order is ready for collection.
  - name: voice
    widget_type: select
    label: Speech voice
    required: false
    default: alloy
    options:
    - label: Alloy
      value: alloy
    - label: Ash
      value: ash
    - label: Ballad
      value: ballad
    - label: Coral
      value: coral
    - label: Echo
      value: echo
    - label: Fable
      value: fable
    - label: Nova
      value: nova
    - label: Onyx
      value: onyx
    - label: Sage
      value: sage
    - label: Shimmer
      value: shimmer
    - label: Verse
      value: verse
    help_text: Choose an available voice; alloy is the default. The voice changes the generated speech, not the
      supplied wording.
- operation_id: embed
  title: Generate text embeddings
  section: OpenAI Tools
  fields:
  - name: texts
    widget_type: json
    label: Texts to embed (JSON array)
    required: true
    help_text: Supply 1–4 nonempty strings, each at most 8000 UTF-8 bytes. No automatic splitting or truncation.
      Returned vectors preserve this order.
    placeholder: '["Refunds are available within 30 days."]'
  - name: model
    widget_type: select
    label: Embedding model
    required: false
    default: text-embedding-3-small
    help_text: 'Default: text-embedding-3-small (1536 dimensions). Large defaults to 3072. Use the same model for
      stored text and search questions.'
    options:
    - label: Text embedding 3 small
      value: text-embedding-3-small
    - label: Text embedding 3 large
      value: text-embedding-3-large
  - name: dimensions
    widget_type: number
    label: Embedding dimensions
    required: false
    help_text: 'Optional integer: 1–1536 for small or 1–3072 for large. Blank uses the model default. Match your
      vector-store dimensions exactly.'
    placeholder: '1536'

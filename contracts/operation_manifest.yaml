  operation_kind: action
  category: ai
  connection_type_ids:
  - openai_api
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: text
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 4096
  - name: voice
    value_type: text

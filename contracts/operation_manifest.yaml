operations:
- operation_id: predicate
  display_name: Decide yes or no
  description: Decide yes or no with OpenAI.
  operation_kind: action
  category: ai
  connection_type_ids:
  - openai_api
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: prompt
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 16000
  - name: evidence
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 16000
  outputs:
  - name: value
    value_type: number
  - name: request_id
    value_type: text
  error_codes: &id001
  - effect_claim_required
  - test_mode_suppressed
  - invalid_payload
  - invalid_connection
  - not_configured
  - authentication_failed
  - rate_limited
  - provider_error
  - outcome_unknown
  - invalid_response
  - artifact_access_failed
  - internal_error
- operation_id: choice
  display_name: Choose an option
  description: Choose an option with OpenAI.
  operation_kind: action
  category: ai
  connection_type_ids:
  - openai_api
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: prompt
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 16000
  - name: evidence
    value_type: text
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 16000
  - name: choices
    value_type: array
    required: true
    schema:
      type: array
      minItems: 2
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 100
  outputs:
  - name: value
    value_type: text
  - name: request_id
    value_type: text
  error_codes: *id001

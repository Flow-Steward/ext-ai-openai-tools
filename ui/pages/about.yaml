  type: markdown
  title: Overview
  body: '## OpenAI Tools


    Use decisions (predicate probability, choice, score ordered levels), text or image
    moderation, image generation and edits, transcription, and speech in workflow
    Extension tools steps. Calls send your data to OpenAI and may incur charges.


    Requires extension runtime contract 1.4.0 or later; compatibility is checked during installation.

    ### Connect


    1. Create an OpenAI API project and API key at https://platform.openai.com/api-keys.
    Ensure the project has access to the selected models and billing where required.

    2. Open this extension’s Connection page, choose your Flow Steward project, enter
    a display name and your API key, then save. Flow Steward stores the key encrypted
    for that project.

    3. Add an OpenAI Tools operation to a workflow and select that connection. Supply
    the required inputs and run.


    Image inputs must be PNG, JPEG, or WebP artifacts up to 15 MB (15,000,000 bytes). Audio input is limited to 24 MB. Speech outputs MP3.
    OpenAI plans to shut down the Speech API model on 6 January 2027. Disclose to
    listeners that speech is AI-generated. Models can make mistakes; review decisions
    and moderation before relying on them. Timeouts may have incurred a charge: check
    OpenAI logs before retrying.

    '

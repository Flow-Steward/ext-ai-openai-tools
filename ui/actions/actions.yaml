actions:
- action_id: predicate
  title: Estimate a yes probability
  description: Evaluate a question against supplied evidence using OpenAI. Returns value as a number from 0 to 1
    representing yes probability, rather than a boolean; choose a threshold in a later workflow step.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: prompt
    type: string
    required: true
  - name: evidence
    type: string
    required: true
  result_fields:
  - value
  - request_id
- action_id: choice
  title: Choose an option from evidence
  description: Use OpenAI to select one of 2–20 supplied option strings based on instructions and evidence. Returns
    the selected string as value.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: prompt
    type: string
    required: true
  - name: evidence
    type: string
    required: true
  - name: choices
    type: array
    required: true
  result_fields:
  - value
  - request_id
- action_id: score
  title: Score evidence against ordered levels
  description: Use OpenAI to score evidence on 2–20 supplied levels in order. Returns a numeric value from 0 through
    level count minus one; the score can fall between levels.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: prompt
    type: string
    required: true
  - name: evidence
    type: string
    required: true
  - name: levels
    type: array
    required: true
  result_fields:
  - value
  - request_id
- action_id: moderate_text
  title: Check text for flagged content
  description: Send text to OpenAI moderation and return flagged plus category flags. Use the outputs to route content
    for review; this action does not block or remove content.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: text
    type: string
    required: true
  result_fields:
  - flagged
  - categories
  - request_id
- action_id: moderate_image
  title: Check an image for flagged content
  description: Send a PNG, JPEG or WebP artifact to OpenAI moderation and return flagged plus category flags. The
    action does not modify the image or make a workflow routing decision.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: artifact_handle
    type: artifact_handle
    required: true
  result_fields:
  - flagged
  - categories
  - request_id
- action_id: generate_image
  title: Generate an image from a prompt
  description: Send a description to OpenAI and save the generated image as a workflow artifact. Returns output_artifact_handle
    and the provider request ID.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: prompt
    type: string
    required: true
  result_fields:
  - output_artifact_handle
  - request_id
- action_id: edit_image
  title: Edit an image using instructions
  description: Send a source image artifact and editing instructions to OpenAI. Saves the edited image as a new
    workflow artifact and returns its handle.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: artifact_handle
    type: artifact_handle
    required: true
  - name: prompt
    type: string
    required: true
  result_fields:
  - output_artifact_handle
  - request_id
- action_id: transcribe
  title: Transcribe an audio file to text
  description: Send an audio artifact and its filename to OpenAI transcription. Returns transcript text and a provider
    request ID; supply the real supported audio extension.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: artifact_handle
    type: artifact_handle
    required: true
  - name: filename
    type: string
    required: true
  result_fields:
  - text
  - request_id
- action_id: speech
  title: Generate speech from text
  description: Send up to 4096 characters to OpenAI and save the generated speech as an audio artifact. Select a
    voice; disclose AI-generated speech to listeners.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: text
    type: string
    required: true
  - name: voice
    type: string
    required: false
  result_fields:
  - output_artifact_handle
  - request_id
- action_id: embed
  title: Generate text embeddings
  description: Use OpenAI to generate one numeric embedding per input text, in order. Accepts 1–4 texts and returns
    vectors, model, dimensions, usage and request ID; use matching model and dimensions in your vector store.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: texts
    type: array
    required: true
  - name: model
    type: string
    required: false
  - name: dimensions
    type: number
    required: false
  result_fields:
  - vectors
  - model
  - dimensions
  - usage
  - request_id

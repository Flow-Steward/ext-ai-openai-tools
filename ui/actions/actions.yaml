actions:
- action_id: predicate
  title: Decide yes or no
  description: Decide yes or no with OpenAI.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: prompt
    type: string
    required: true
  result_fields:
